<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>学院新闻块</title>
    <style type="text/css">
      body,
      h2,
      ul,
      li,
      p {
        margin: 0;
        padding: 0;
      }
      body {
        font-family: "微软雅黑";
        font-size: 14px;
        color: #333;
        background: #e8e8e8;
      }
      a {
        text-decoration: none;
      }
      ul,
      li {
        list-style: none;
      }
      .news {
        width: 960px;
        margin: 20px auto;
        background: #fff;
        padding: 10px;
      }
      .news-hd {
        border-bottom: 1px solid #ccc;
        overflow: hidden;
      }
      .news-hd h2 {
        float: left;
        width: 140px;
        height: 40px;
        line-height: 40px;
        background: #1c4ba9;
        color: #fff;
        font-size: 18px;
        text-align: center;
      }
      .news-hd h2 span {
        font-size: 10px;
        margin-left: 8px;
      }
      .en {
        float: left;
        line-height: 40px;
        margin-left: 15px;
        color: #666;
        font-size: 14px;
      }
      .more {
        float: right;
        line-height: 40px;
        color: #999;
        font-size: 12px;
      }
      .more:hover {
        color: #1c4ba9;
      }
      .news-bd {
        padding-top: 10px;
        overflow: hidden;
      }
      .news-pic {
        float: left;
        width: 320px;
      }
      .news-pic img {
        width: 320px;
        height: 180px;
      }
      .pic-title {
        line-height: 30px;
        text-align: center;
        color: #c00;
        font-size: 14px;
      }
      .pic-title:hover {
        text-decoration: underline;
      }
      .news-list {
        float: right;
        width: 600px;
      }
      .news-list li {
        height: 38px;
        line-height: 38px;
        list-style-type: disc;
        color: #1c4ba9;
        padding-left: 24px;
        margin-left: 15px;
      }
      .news-list li a {
        color: #333;
      }
      .news-list li a:hover {
        color: #1c4ba9;
      }
      .news-list li .date {
        float: right;
        color: #999;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <div class="news">
      <div class="news-hd">
        <h2>学校要闻<span>●</span></h2>
        <span class="en">|| College News</span>
        <a
          href="#"
          class="more"
          >更多&gt;&gt;</a
        >
      </div>
      <div class="news-bd">
        <div class="news-pic">
          <a href="#"
            ><img
              src="images/lianmeng.jpg"
              alt="新闻图片"
          /></a>
          <p class="pic-title">
            <a href="#">中国工业互联网研究院来我校交流访问</a>
          </p>
        </div>
        <ul class="news-list">
          <li>
            <a href="#">学校联合发起成立软件行业产教联盟</a
            ><span class="date">2021-04-09</span>
          </li>
          <li>
            <a href="#">学校“四个推进”掀起党史学习教育热潮</a
            ><span class="date">2021-04-08</span>
          </li>
          <li>
            <a href="#">学校召开2021年度体育工作会议</a
            ><span class="date">2021-04-02</span>
          </li>
          <li>
            <a href="#">我校举行“铭记历史 缅怀先烈”清明节祭扫先烈活动</a
            ><span class="date">2021-04-01</span>
          </li>
          <li>
            <a href="#">中国工业互联网研究院来我校交流访问</a
            ><span class="date">2021-03-30</span>
          </li>
          <li>
            <a href="#">学校召开党务干部业务培训会议</a
            ><span class="date">2021-03-30</span>
          </li>
        </ul>
      </div>
    </div>
  </body>
</html>
