    <title>校园图书馆 - 二级菜单导航条</title>
    <style>
      body {
        font-family: "微软雅黑", "Microsoft YaHei", sans-serif;
        margin: 0;
      }

      .nav {
        width: 100%;
        height: 48px;
        background-color: rgb(30, 94, 60);
      }

      ul.menu,
      ul.sub {
        list-style: none;
        margin: 0;
        padding: 0;
      }

      ul.menu {
        width: 900px;
        height: 48px;
        margin: 0 auto;
      }

      .menu li {
        display: inline-block;
        width: 180px;
        height: 48px;
        vertical-align: top;
      }

      .menu li a {
        display: block;
        width: 180px;
        height: 48px;
        line-height: 48px;
        text-align: center;
        font-size: 16px;
        color: #ffffff;
        text-decoration: none;
      }

      .menu li:hover {
        background-color: rgb(19, 66, 41);
      }

      ul.sub {
        display: none;
        width: 200px;
      }

      .menu li:hover ul.sub {
        display: block;
      }

      .sub li {
        display: block;
        width: 200px;
        height: 44px;
        line-height: 44px;
        background-color: rgb(30, 94, 60);
        border-top: 1px solid rgb(18, 64, 38);
      }

      .sub li a {
        display: block;
        width: 200px;
        height: 44px;
        line-height: 44px;
        text-align: center;
        font-size: 14px;
        color: #ffffff;
        text-decoration: none;
      }

      .sub li a:hover {
        background-color: #ffffff;
        color: rgb(30, 94, 60);
      }
    </style>
